<!DOCTYPE html>
<html>
    <head>

    </head>
    <body>
        <canvas id="myCanvas" width="300" height="200"></canvas>
  
  <script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "black";
    ctx.fillRect(10, 10, 200, 100);
  </script>

  //Scalable Vector Graphics (SVG)
  //SVG is a markup language that uses XML to describe two-dimensional vector graphics. Unlike the Canvas element, SVG focuses on creating graphics that can be scaled and resized without losing quality.

  <svg width="100" height="100">
  <circle cx="50" cy="50" r="40" fill="black" />
</svg>
    </body>
</html>
